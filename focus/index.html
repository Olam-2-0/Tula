<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit — Pomodoro Focus Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/core.css">
  <link rel="stylesheet" href="../src/styles/focus.css">
</head>
<body class="focus-page-body">

  <!-- Top Tool Header Bar (Fixed Light Theme by Deliberate Design) -->
  <header class="tool-header-bar" style="background: rgba(255, 255, 255, 0.9); border-bottom: 1px solid #E2E8F0;">
    <a href="../index.html" class="back-to-orbit-btn" style="background: #FFFFFF; border-color: #CBD5E1; color: #475569;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      &larr; Back to Orbit
    </a>

    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <span class="nav-brand" style="font-size: 1.15rem; color: #0F172A;">
        <span class="logo-orb" style="width: 22px; height: 22px;"></span>
        <span>Pomodoro Focus Timer</span>
      </span>
    </div>
  </header>

  <main class="focus-layout">
    <!-- Notice regarding intentional fixed-light theme -->
    <div class="fixed-light-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      Fixed-light mode is active to preserve study clarity and focus
    </div>

    <!-- Presets -->
    <div class="timer-presets">
      <button class="preset-btn active" id="preset-25-5">25m Study / 5m Break</button>
      <button class="preset-btn" id="preset-50-10">50m Study / 10m Break</button>
    </div>

    <!-- Visual Countdown Ring -->
    <div class="timer-display-wrap">
      <svg class="timer-svg" viewBox="0 0 320 320">
        <circle class="timer-ring-bg" stroke-width="12" fill="transparent" r="135" cx="160" cy="160"/>
        <circle class="timer-ring-progress" id="timer-ring-progress" stroke-width="12" stroke-linecap="round" fill="transparent" r="135" cx="160" cy="160"/>
      </svg>
      <div class="timer-inner-content">
        <div class="timer-digits" id="timer-digits">25:00</div>
        <div class="timer-mode-label" id="timer-mode-label">Study Focus</div>
        <div class="timer-session-counter" id="timer-session-counter">Session 1 of 4</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="timer-controls">
      <button class="btn-timer-primary" id="timer-start-btn">Start</button>
      <button class="btn-timer-secondary" id="timer-reset-btn">Reset</button>
    </div>

    <!-- Custom Duration Option -->
    <div class="custom-duration-toggle" id="custom-toggle">Custom study/break lengths &darr;</div>
    <div class="custom-inputs-wrap" id="custom-inputs-wrap">
      <label style="font-size: 0.88rem; color: #475569;">Study (mins): <input type="number" id="custom-study-input" value="30" min="1" max="180"></label>
      <label style="font-size: 0.88rem; color: #475569;">Break (mins): <input type="number" id="custom-break-input" value="10" min="1" max="60"></label>
      <button class="btn-timer-secondary" id="apply-custom-btn" style="padding: 0.4rem 0.85rem; font-size: 0.85rem;">Set</button>
    </div>
  </main>

  <script type="module" src="../src/scripts/focus.js"></script>
</body>
</html>

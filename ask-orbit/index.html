<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit — Ask Orbit Task Breakdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/core.css">
  <link rel="stylesheet" href="../src/styles/askOrbit.css">
</head>
<body>

  <!-- Top Tool Header Bar -->
  <header class="tool-header-bar">
    <a href="../index.html" class="back-to-orbit-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      &larr; Back to Orbit
    </a>

    <div style="display: flex; align-items: center; gap: 1rem;">
      <span class="nav-brand" style="font-size: 1.15rem;">
        <span class="logo-orb" style="width: 22px; height: 22px;"></span>
        <span>Ask, Orbit!</span>
      </span>
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Dark and Light theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </div>
  </header>

  <main class="chat-layout">
    <!-- Chat Messages Scroll Container -->
    <div class="chat-messages-container" id="chat-messages">
      <!-- Bubbles populated dynamically by askOrbit.js -->
    </div>

    <!-- Input Form -->
    <form class="chat-input-bar" id="chat-form">
      <input type="text" id="chat-user-input" class="chat-input" placeholder="Type your reply here..." autocomplete="off" autofocus>
      <button type="submit" class="btn-primary" style="padding: 0.75rem 1.4rem;">Send</button>
    </form>
  </main>

  <script type="module" src="../src/scripts/askOrbit.js"></script>
</body>
</html>
